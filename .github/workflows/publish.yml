# Publishes the version in package.json to the VS Code Marketplace, then tags the commit as v<version>.
# Run it from the Actions tab (Publish > Run workflow) after bumping "version" in package.json.
# Needs the repository secret VSCE_PAT (Azure DevOps token with Marketplace "Manage" scope).
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write # to push the release tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version is not released yet
        run: |
          version=$(node -p "require('./package.json').version")
          echo "TAG=v$version" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; bump \"version\" in package.json first." >&2
            exit 1
          fi

      - name: Self-check
        run: node test.js

      - name: Publish
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Tag release
        run: |
          git tag "$TAG"
          git push origin "$TAG"
